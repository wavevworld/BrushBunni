{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Brush Bunni{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      overflow-y: auto;
      overflow-x: hidden; /* guard against accidental sideways scroll on mobile */
    }

    body {
      background-color: #2b2b2b; /* fallback while the image loads / if it fails */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
    }

    /* Per-page backgrounds.
       JPEG line first = fallback for old browsers that ignore image-set.
       image-set line = WebP for modern browsers, JPEG for those without WebP. */
    body.page-home {
      background-image: url("{% static 'blog/bg_about.jpg' %}");
      background-image: image-set(url("{% static 'blog/bg_about.webp' %}") type("image/webp"), url("{% static 'blog/bg_about.jpg' %}") type("image/jpeg"));
    }
    body.page-community {
      background-image: url("{% static 'blog/bg_community.jpg' %}");
      background-image: image-set(url("{% static 'blog/bg_community.webp' %}") type("image/webp"), url("{% static 'blog/bg_community.jpg' %}") type("image/jpeg"));
    }
    body.page-be_online {
      background-image: url("{% static 'blog/bg_online.jpg' %}");
      background-image: image-set(url("{% static 'blog/bg_online.webp' %}") type("image/webp"), url("{% static 'blog/bg_online.jpg' %}") type("image/jpeg"));
    }
    body.page-events {
      background-image: url("{% static 'blog/bg_events.jpg' %}");
      background-image: image-set(url("{% static 'blog/bg_events.webp' %}") type("image/webp"), url("{% static 'blog/bg_events.jpg' %}") type("image/jpeg"));
    }
    body.page-shop,
    body.page-project_bunni {
      background-image: url("{% static 'blog/bg_shop.jpg' %}");
      background-image: image-set(url("{% static 'blog/bg_shop.webp' %}") type("image/webp"), url("{% static 'blog/bg_shop.jpg' %}") type("image/jpeg"));
    }
    /* These two are already small — plain JPEG, no WebP variant needed. */
    body.page-members {
      background-image: url("{% static 'blog/bg_members.jpg' %}");
    }
    body.page-contact {
      background-image: url("{% static 'blog/bg_contact.jpg' %}");
    }

    /* Lighter backgrounds on phones (~1200px wide instead of 1920px) */
    @media (max-width: 768px) {
      body.page-home {
        background-image: url("{% static 'blog/bg_about-mobile.jpg' %}");
        background-image: image-set(url("{% static 'blog/bg_about-mobile.webp' %}") type("image/webp"), url("{% static 'blog/bg_about-mobile.jpg' %}") type("image/jpeg"));
      }
      body.page-community {
        background-image: url("{% static 'blog/bg_community-mobile.jpg' %}");
        background-image: image-set(url("{% static 'blog/bg_community-mobile.webp' %}") type("image/webp"), url("{% static 'blog/bg_community-mobile.jpg' %}") type("image/jpeg"));
      }
      body.page-be_online {
        background-image: url("{% static 'blog/bg_online-mobile.jpg' %}");
        background-image: image-set(url("{% static 'blog/bg_online-mobile.webp' %}") type("image/webp"), url("{% static 'blog/bg_online-mobile.jpg' %}") type("image/jpeg"));
      }
      body.page-events {
        background-image: url("{% static 'blog/bg_events-mobile.jpg' %}");
        background-image: image-set(url("{% static 'blog/bg_events-mobile.webp' %}") type("image/webp"), url("{% static 'blog/bg_events-mobile.jpg' %}") type("image/jpeg"));
      }
      body.page-shop,
      body.page-project_bunni {
        background-image: url("{% static 'blog/bg_shop-mobile.jpg' %}");
        background-image: image-set(url("{% static 'blog/bg_shop-mobile.webp' %}") type("image/webp"), url("{% static 'blog/bg_shop-mobile.jpg' %}") type("image/jpeg"));
      }
    }

    /* ÐŸÐ¾Ð»ÑƒÐ¿Ñ€Ð¾Ð·Ñ€Ð°Ñ‡Ð½Ñ‹Ð¹ Ð¿Ñ€Ð°Ð²Ñ‹Ð¹ ÑÐºÑ€Ð¾Ð»Ð»Ð±Ð°Ñ€ */
    html {
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
      scrollbar-width: thin;
    }

    body::-webkit-scrollbar {
      width: 8px;
    }

    body::-webkit-scrollbar-track {
      background: transparent;
    }

    body::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 5px;
    }

    body::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.7);
    }

    .sidebar {
      width: 280px;
      background-color: transparent;
      color: white;
      padding: 30px 0 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
    }
        /* Ð¤Ð¸ÐºÑ: ÑÐ°Ð¹Ñ‚Ð±Ð°Ñ€ Ð½Ð° Ð²ÑÑŽ Ð²Ñ‹ÑÐ¾Ñ‚Ñƒ Ð¸ ÐºÐ¾Ð»Ð¾Ð½ÐºÐ¾Ð¹ */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 280px;
      display: flex;
      flex-direction: column;
      /* Ñ‚Ð¾, Ñ‡Ñ‚Ð¾ ÑƒÐ¶Ðµ Ð±Ñ‹Ð»Ð¾ Ñƒ Ñ‚ÐµÐ±Ñ: Ñ„Ð¾Ð½/Ñ†Ð²ÐµÑ‚/Ð¿Ð°Ð´Ð´Ð¸Ð½Ð³Ð¸ Ð¼Ð¾Ð¶Ð½Ð¾ Ð¾ÑÑ‚Ð°Ð²Ð¸Ñ‚ÑŒ */
    }

    /* Ð”ÐµÐ»Ð°ÐµÐ¼ Ð²ÐµÑ€Ñ…Ð½Ð¸Ð¹ Ð±Ð»Ð¾Ðº Ð²Ð½ÑƒÑ‚Ñ€Ð¸/sidebar Ð¿Ñ€Ð¾ÐºÑ€ÑƒÑ‡Ð¸Ð²Ð°ÐµÐ¼Ñ‹Ð¼ */
    .sidebar > div:first-child {
      overflow-y: auto;      /* ÐºÐ»ÑŽÑ‡! Ð¿Ð¾ÑÐ²Ð¸Ñ‚ÑÑ ÑÐºÑ€Ð¾Ð»Ð» Ð²Ð½ÑƒÑ‚Ñ€Ð¸ Ð¼ÐµÐ½ÑŽ */
      min-height: 0;         /* Ñ‡Ñ‚Ð¾Ð±Ñ‹ flex-Ñ€Ð°Ð·Ð¼ÐµÑ‚ÐºÐ° Ð¿Ð¾Ð·Ð²Ð¾Ð»Ð¸Ð»Ð° Ð±Ð»Ð¾ÐºÑƒ ÑÐ¶Ð°Ñ‚ÑŒÑÑ Ð¸ ÑÐºÑ€Ð¾Ð»Ð»Ð¸Ñ‚ÑŒÑÑ */
      padding-right: 8px;    /* Ñ‡Ñ‚Ð¾Ð±Ñ‹ Ð½Ðµ Ð¿ÐµÑ€ÐµÐºÑ€Ñ‹Ð²Ð°Ð»Ð¾ÑÑŒ ÑÐºÑ€Ð¾Ð»Ð»Ð±Ð°Ñ€Ð¾Ð¼ */
    }

    /* Ð¡Ð¾Ñ†. Ð¸ÐºÐ¾Ð½ÐºÐ¸ Ð²ÑÐµÐ³Ð´Ð° Ð²Ð½Ð¸Ð·Ñƒ, Ð±ÐµÐ· Ð¿Ñ€Ð¾ÐºÑ€ÑƒÑ‚ÐºÐ¸ */
    .social-icons {
      padding: 16px 20px 20px 20px;
      /* Ð¾ÑÑ‚Ð°Ñ‘Ñ‚ÑÑ Ð²Ñ‚Ð¾Ñ€Ñ‹Ð¼ flex-Ñ€ÐµÐ±Ñ‘Ð½ÐºÐ¾Ð¼ Ð¸ Â«Ð¿Ñ€Ð¸Ð»Ð¸Ð¿Ð°ÐµÑ‚Â» Ðº Ð½Ð¸Ð·Ñƒ ÑÐ°Ð¹Ð´Ð±Ð°Ñ€Ð° */
    }

    /* (ÐžÐ¿Ñ†Ð¸Ð¾Ð½Ð°Ð»ÑŒÐ½Ð¾) Ð°ÐºÐºÑƒÑ€Ð°Ñ‚Ð½Ñ‹Ð¹ Ñ‚Ð¾Ð½ÐºÐ¸Ð¹ ÑÐºÑ€Ð¾Ð»Ð» Ñƒ Ð¼ÐµÐ½ÑŽ */
    .sidebar > div:first-child::-webkit-scrollbar { width: 8px; }
    .sidebar > div:first-child::-webkit-scrollbar-track { background: transparent; }
    .sidebar > div:first-child::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.35);
      border-radius: 6px;
    }
    .sidebar > div:first-child::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255,255,255,0.55);
    }

    /* ÐÐ° Ð¾Ñ‡ÐµÐ½ÑŒ Ð½Ð¸Ð·ÐºÐ¸Ñ… ÑÐºÑ€Ð°Ð½Ð°Ñ… Ð¼Ð¾Ð¶Ð½Ð¾ Ñ‡ÑƒÑ‚ÑŒ ÑƒÐ¼ÐµÐ½ÑŒÑˆÐ¸Ñ‚ÑŒ Ð¾Ñ‚ÑÑ‚ÑƒÐ¿Ñ‹ Ð² Ð¼ÐµÐ½ÑŽ */
    @media (max-height: 700px) {
      .nav-link { padding: 6px 28px; margin-bottom: 4px; }
      .logo img { height: 170px; }
    }

    .menu-container {
      position: relative;
    }

    .menu-container::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 3px; /* â†  Ð’ÐµÑ€Ñ‚Ð¸ÐºÐ°Ð»ÑŒÐ½Ð°Ñ Ð»Ð¸Ð½Ð¸Ñ Ñ‚Ð¾Ð»Ñ‰Ðµ */
      height: 100%;
      background-color: white;
    }

    .logo {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding-top: 15px;
      padding-left: 55px;
      margin-bottom: 20px;
    }

    .logo img {
      height: 200px;
      width: auto;
    }

    .nav-link {
      font-family: 'Poppins', sans-serif; /*  ÑˆÑ€Ð¸Ñ„Ñ‚ */
      color: white;
      font-size: 1.7rem; /*  Ð ÐÐ—ÐœÐ•Ð  Ñ‚ÐµÐºÑÑ‚ */
      padding: 9px 38px; /*  ÑƒÐ¼ÐµÐ½ÑŒÑˆÐ¸Ñ‚ÑŒ Ñ€Ð°ÑÑÑ‚Ð¾ÑÐ½Ð¸Ðµ */
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      transition: all 0.2s ease;
    }

    .nav-link.active {
      background-color: white;
      color: black;
      font-weight: bold;
    }

    .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .social-icons {
      display: flex;
      justify-content: space-around;
      padding-top: 20px;
    }

    .social-icons img {
      width: 28px;
      height: auto;
      filter: brightness(0) invert(1);
      transition: transform 0.2s;
      object-fit: contain;
    }

    .social-icons img:hover {
      transform: scale(1.1);
    }

    .content {
      flex-grow: 1;
      position: relative;
      overflow: hidden;
      margin-left: 280px;
      
    }

    /* For events page specifically */
    body.page-events .content {
        margin-left: 280px;
    }
    body.page-events .content-box {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
      max-height: none !important;
      overflow: visible !important;
      margin-top: 0 !important;
    }
    .content-box {
      position: fixed;
      left: 280px;
      margin-top: var(--content-offset, 60px);
      width: calc(100vw - 320px);
      max-width: 90%;
      max-height: 80vh;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      overflow-y: auto;
      z-index: 1;
      transition: all 0.25s ease;
    }

    /* Custom vertical scrollbar for content */
    .content-scrollbar {
      position: fixed;
      right: 20px;
      top: 20%;
      width: 6px;
      height: 60%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      z-index: 1001;
      cursor: pointer;
    }

    .scrollbar-thumb {
      position: absolute;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 3px;
      min-height: 20px;
      transition: all 0.2s ease;
    }

    .scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.8);
      width: 8px;
      right: -1px;
    }
    .content-box::-webkit-scrollbar {
      width: 8px;
    }

    .content-box::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .content-box::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
    }

    .content-box::-webkit-scrollbar-thumb:hover {
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* ===== Mobile menu controls (hidden on desktop) ===== */
    .menu-toggle {
      display: none;
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 1100;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      cursor: pointer;
      padding: 0;
    }
    .menu-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      margin: 4px auto;
      background: #fff;
      border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    /* Animate the burger into an X when the menu is open */
    body.menu-open .menu-toggle span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    body.menu-open .menu-toggle span:nth-child(2) { opacity: 0; }
    body.menu-open .menu-toggle span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 900;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    /* ===== Mobile layout ===== */
    @media (max-width: 768px) {
      .menu-toggle { display: block; }

      .sidebar {
        width: 260px;
        background-color: rgba(20, 20, 20, 0.96);
        transform: translateX(-100%);
        transition: transform 0.28s ease;
        padding-top: calc(70px + env(safe-area-inset-top)); /* clear the burger + notch */
      }
      body.menu-open .sidebar { transform: translateX(0); }

      .sidebar-overlay { display: block; pointer-events: none; }
      body.menu-open .sidebar-overlay { opacity: 1; pointer-events: auto; }

      /* The vertical white divider only makes sense next to the fixed desktop menu */
      .menu-container::after { display: none; }

      .logo { padding-left: 24px; }
      .logo img { height: 120px; }
      .nav-link { font-size: 1.3rem; padding: 8px 24px; }

      /* Content takes the full width and scrolls with the page, not in a fixed box */
      .content { margin-left: 0; overflow: visible; }
      .content-box,
      body.page-events .content-box {
        position: static;
        left: auto;
        width: auto;
        max-width: 100%;
        max-height: none;
        margin: 70px 14px 24px;
        overflow: visible;
        background-color: rgba(255, 255, 255, 0.92);
      }

      /* The custom desktop scrollbar is tied to the fixed content box — hide it */
      .content-scrollbar { display: none; }
    }

    /* ===== Narrow phones ===== */
    @media (max-width: 480px) {
      .content-box,
      body.page-events .content-box {
        margin: 62px 10px 20px;
        padding: 20px;
        border-radius: 12px;
      }
      .logo img { height: 100px; }
      .nav-link { font-size: 1.2rem; padding: 8px 20px; }
    }
  </style>
{% block extra_css %}{% endblock %}
</head>


<body class="page-{{ current_page }}">

  <!-- Mobile menu toggle -->
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div>
      <div class="logo">
        <img src="{% static 'blog/logo.png' %}" alt="Brush Bunni Logo">
      </div>
      <div class="menu-container">
        <nav class="nav flex-column">
          <a class="nav-link {% if current_page == 'home' %}active{% endif %}" href="{% url 'home' %}">About Us</a>
          <a class="nav-link {% if current_page == 'community' %}active{% endif %}" href="{% url 'community' %}">Community</a>
          <a class="nav-link {% if current_page == 'be_online' %}active{% endif %}" href="{% url 'be_online' %}">BB Notes</a>
          <a class="nav-link {% if current_page == 'events' %}active{% endif %}" href="{% url 'events' %}">Events</a>
          <!-- <a class="nav-link {% if current_page == 'shop' %}active{% endif %}" href="{% url 'shop' %}">Shop</a> -->
          <a class="nav-link {% if current_page == 'project_bunni' %}active{% endif %}" href="{% url 'project_bunni' %}">Project Bunni</a>
          <a class="nav-link {% if current_page == 'members' %}active{% endif %}" href="{% url 'members' %}">Members</a>
          <!-- <a class="nav-link {% if current_page == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact us</a> -->
        </nav>
      </div>
    </div>

    <div class="social-icons">
      <a href="https://discord.com/invite/YWnYE4EHk5" target="_blank">
        <img src="{% static 'blog/icons/discord.svg' %}" alt="Discord">
      </a>
      <a href="https://www.instagram.com/bb_brushbunni/" target="_blank">
        <img src="{% static 'blog/icons/instagram.svg' %}" alt="Instagram">
      </a>
      <a href="mailto:youremail@example.com">
        <img src="{% static 'blog/icons/gmail.svg' %}" alt="Email">
      </a>
    </div>
  </div>
  <!-- Custom Scrollbar -->
  <div class="content-scrollbar" id="customScrollbar">
    <div class="scrollbar-thumb" id="scrollbarThumb"></div>
  </div>
  <!-- Content -->
  <div class="content">
    <div class="content-box">
      {% block content %}
      {% endblock %}
    </div>
  </div>

  <script>
  // Mobile menu: toggle the off-canvas sidebar
  (function () {
    const body = document.body;
    const toggle = document.getElementById("menuToggle");
    const overlay = document.getElementById("sidebarOverlay");
    const sidebar = document.getElementById("sidebar");
    if (!toggle || !overlay || !sidebar) return;

    function setOpen(open) {
      body.classList.toggle("menu-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }

    toggle.addEventListener("click", () => setOpen(!body.classList.contains("menu-open")));
    overlay.addEventListener("click", () => setOpen(false));
    // Close when a menu link is tapped (single-page feel on mobile)
    sidebar.querySelectorAll(".nav-link").forEach((link) =>
      link.addEventListener("click", () => setOpen(false))
    );
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setOpen(false);
    });
  })();

  // Custom scrollbar functionality
  function initCustomScrollbar() {
    const contentBox = document.querySelector(".content-box");
    const scrollbar = document.getElementById("customScrollbar");
    const thumb = document.getElementById("scrollbarThumb");
    
    if (!contentBox || !scrollbar || !thumb) return;
    
    function updateScrollbar() {
      const scrollRatio = contentBox.scrollTop / (contentBox.scrollHeight - contentBox.clientHeight);
      const thumbHeight = Math.max(20, (contentBox.clientHeight / contentBox.scrollHeight) * scrollbar.clientHeight);
      const thumbTop = scrollRatio * (scrollbar.clientHeight - thumbHeight);
      
      thumb.style.height = thumbHeight + 'px';
      thumb.style.top = thumbTop + 'px';
    }
    
    contentBox.addEventListener('scroll', updateScrollbar);
    window.addEventListener('resize', updateScrollbar);
    
    // Scrollbar click handling
    scrollbar.addEventListener('click', (e) => {
      const rect = scrollbar.getBoundingClientRect();
      const clickRatio = (e.clientY - rect.top) / rect.height;
      contentBox.scrollTop = clickRatio * (contentBox.scrollHeight - contentBox.clientHeight);
    });
    
    updateScrollbar();
  }

  window.addEventListener("load", () => {
    initCustomScrollbar();
    
    const activeLink = document.querySelector(".nav-link.active");
    const contentBox = document.querySelector(".content-box");

    if (activeLink && contentBox) {
      const linkRect = activeLink.getBoundingClientRect();
      const scrollY = window.scrollY || window.pageYOffset;
      const boxHeight = contentBox.offsetHeight;
      const viewportHeight = window.innerHeight;

      const centeredOffset = linkRect.top + linkRect.height / 2 - boxHeight / 2 + scrollY;
      const tooTall = boxHeight > viewportHeight * 0.6;
      const topLimit = 100;
      const finalOffset = tooTall ? topLimit : centeredOffset;

      contentBox.style.setProperty('--content-offset', `${finalOffset}px`);
    }
  });
  </script>





</body>
</html>
